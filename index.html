<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cloudflare.com" integrity="sha512-V7am1WuyDMdQSuHBvyMRNjqECbaxad5JuQlnPnXwWOJEUTXDoJVGcKV7SqWbVn28GRIGt8SZxo6F652rp5XOeg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelForge</title>
    <meta name="description" content="Aplikasi menggambar pixel art berbasis grid yang sederhana, kreatif, dan mudah digunakan.">
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
</head>
<body>
    <header class="header" id="header">
        <div>
            <img class="logo" src="https://projectpixel.uk/wp-content/uploads/2024/04/Logo.png" height="60px">
        </div>
        <nav>
            <a class="homeBtn">Home</a>
            <a class="editorBtn">Editor</a>
        </nav>
    </header>
    <main class="home" id="home">
        <section>
            <img src="https://cdn.myportfolio.com/d6cd5305-3abc-4a73-9229-225bf778ad46/dfd0a943-fba8-493c-90da-56f9f6bb0824_car_7x4.png?h=d8efb7cda099c38eba425f8b22377bf3" height="360px">
        </section>
        <section>
            <h1>Every Pixel Tells a Story</h1>
            <p>PixelForge is a simple and creative pixel art editor that lets you turn a blank grid into colorful pixel artwork. Choose your colors, draw pixel by pixel, and bring your imagination to life.</p>
        </section>
    </main>

    <main class="container" id="container">
        <section class="toolbox" id="toolbox">
            <div class="color-container">
                <label for="color">color</label>
                <input type="color" id="color" class="color" value="gray">
            </div>
            <div class="eraser" id="eraser">
                &#128465
            </div>
            <div class="save" id="save">
                &#128190
            </div>

            <p class='mode'>
                Mode: Drawing
            </p>
            
        </section>
        <section class="grids" id="grids">
            
        </section>
    </main>
    
</body>
</html>
